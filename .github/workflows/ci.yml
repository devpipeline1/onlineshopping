name: CI
on:
  push:
    branches:
      - main
    paths:
      - 'shopping/**'
      - '.github/workflows/ci.yml'

  workflow_dispatch:

permissions:
  contents: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - frontend
          - product
          - order

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }} Image
        uses: docker/build-push-action@v6
        with:
          context: ./shopping/${{ matrix.service }}
          file: ./shopping/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/online-shop:${{ matrix.service }}-${{ github.run_id }}

  # =====================================================
  # JOB 2: UPDATE HELM IMAGE TAGS
  # =====================================================
  update-helm-values:
    name: Update Helm Image Tags
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update Helm values.yaml
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: |
            yq -i '.frontend.image.tag = "frontend-" + strenv(IMAGE_TAG)' helm/shopping-chart/hvalues.yaml
            yq -i '.productApi.image.tag = "product-" + strenv(IMAGE_TAG)' helm/shopping-chart/values.yaml
            yq -i '.orderApi.image.tag = "order-" + strenv(IMAGE_TAG)' helm/shopping-chart/values.yaml
        env:
          IMAGE_TAG: ${{ github.run_id }}

      - name: Commit and Push Helm Changes
        run: |
          git config user.name "devpipeline"
          git config user.email "devpipeline@gmail.com"

          git add helm/shopping-chart/values.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Helm image tags to ${{ github.run_id }}"
          git push origin HEAD:main

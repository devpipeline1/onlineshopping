apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopping-ingress
  namespace: {{ .Values.global.namespace }}
spec:
  ingressClassName: nginx
  rules:
    - host: myfirst-web.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

